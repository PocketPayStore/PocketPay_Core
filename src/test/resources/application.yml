spring:
  application:
    name: PocketPay_Core
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s

jwt:
  secret: jkZo7UPI+NraSo/EQTCj41IRHSsOuLD7ah5M2arIANcJUTH/bIRWFYzvztR6JvIOB6qKWo/GS9B5lOygQJdE3A==
  expiry-hours: 1

idempotency:
  lock-ttl-seconds: 60
  result-ttl-seconds: 60
  lock-wait-timeout-millis: 5000
  lock-poll-interval-millis: 50

lock:
  default-wait-time-seconds: 5
  default-lease-time-seconds: 3

payment:
  point-earn-rate: 0.01

pg:
  provider-name: test
  webhook:
    secret: test

mock-pg:
  base-url: test

settlement:
  pg-fee-rate: 0.029
  platform-fee-rate: 0.05

resilience4j:
  retry:
    instances:
      pgClient:
        max-attempts: 2
  circuitbreaker:
    instances:
      pgClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 100ms
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
