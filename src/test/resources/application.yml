spring:
  application:
    name: PocketPay_Core

  # 테스트는 로컬/CI 어디서 돌든 실제 MySQL 없이 임베디드 H2로만 떠야 한다.
  # Flyway 마이그레이션은 MySQL 전용 문법(ENGINE=InnoDB, JSON, NOW(6) 등)이라 H2에서
  # 그대로 실행하면 깨지므로, 테스트에서는 꺼두고 Hibernate가 엔티티 기준으로 스키마를 만들게 한다.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
