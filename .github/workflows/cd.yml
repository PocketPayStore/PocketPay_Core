name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create application-dev.yml
        run: |
          cat > src/main/resources/application-dev.yml << 'EOF'
          ${{ secrets.APPLICATION_DEV_YML }}
          EOF

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:api-latest \
            -t $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:api-${{ github.sha }} .
          docker push $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:api-latest
          docker push $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:api-${{ github.sha }}
          echo "image_uri=$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:api-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Debug build-and-push output
        run: |
          echo "image_uri output value: ${{ steps.build-image.outputs.image_uri }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Debug received output
        run: |
          echo "needs.build-and-push.outputs.image_uri = ${{ needs.build-and-push.outputs.image_uri }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy to ECS service (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true